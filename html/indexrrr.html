<!DOCTYPE html>
<html lang="en">
<head>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
   <link rel="stylesheet" href="styles.css">
   <link rel="stylesheet" href="responsive-styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
</head>
<body>
<style>
    @import url("https://fonts.googleapis.com/css?family=Varela+Round");

    :root {
        --color-1: #21d4fd;
        --color-2: #b721ff;
        --color-3: #08aeea;
        --color-4: #2af598;
    }

    body {
        font-family: 'Varela Round', sans-serif;
        margin: 0;
        padding: 0;
    }

    .Header {
        position: relative;
        height: 35vh;
        display: block;
    }

    .Header-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(19deg, var(--color-1), var(--color-2));
        transform-origin: 0px 0px;
        overflow: hidden;
        z-index: -1;
    }

    .Header-background::before,
    .Header-background::after {
        display: block;
        position: absolute;
        content: '';
        width: 80%;
        height: 33.333333333333336%;
        opacity: 0.3;
        filter: blur(15px);
    }

    .Header-background::before {
        background: var(--color-1);
        right: 0;
    }

    .Header-background::after {
        background: var(--color-2);
        bottom: 0;
    }

    .Header-content {
        text-align: center;
        padding: 4rem 2rem;
        margin: 0 auto;
    }

    @media (min-width: 30rem) {
        .Header-content {
            text-align: left;
            padding: 8rem 4rem;
            max-width: 54rem;
            display: flex;
            justify-content: space-between;
        }
    }

    .Header-hero h1,
    .Header-hero p {
        color: #fff;
        text-shadow: 0 0.5rem 1rem rgba(50, 0, 100, 0.1);
    }

    .Header-hero h1 {
        margin: 0;
        font-size: 2.5rem;
    }

    .Header-hero p {
        font-size: 1.2rem;
        margin-bottom: 1.5rem;
    }

    .Header-visuals {
        position: relative;
        margin-top: 2rem;
        transform: translateY(-50%) rotate(-10deg);
    }

    @media (min-width: 58rem) {
        .Header-visuals {
            margin: 0;
            transform: translateY(-3rem) rotate(-10deg);
        }
    }

    .circle {
        position: relative;
        display: inline-block;
        background: #fff;
        padding: 1rem;
        border-radius: 80%;
        box-shadow: 0 1rem 1rem -0.4rem rgba(50, 0, 100, 0.1), 0 0.2rem 0.5rem rgba(50, 0, 100, 0.05), inset 0.2rem -0.2rem 0.2rem -0.4rem rgba(50, 0, 100, 0.1);
        text-align: center;
        width: 10rem;
        height: 10rem;
    }

    .circle img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 80%;
    }

    .circle::before {
        background: conic-gradient(var(--color-3) 0% 25%, var(--color-4) 25% 100%);
        width: 100%;
        height: 100%;
        border-radius: 80%;
    }

    .circle::after {
        display: inline-block;
        margin: 0.3rem;
        padding: 0.2rem;
        border: 1px solid #f1f1f1;
        box-shadow: inset -0.05rem 0.05rem 0.3rem 0rem rgba(50, 0, 100, 0.05);
        border-radius: 80%;
    }
</style>

<div class="Header">
    <div class="Header-background"></div>
    <div class="Header-content">
        <div class="Header-hero"></div>
        <div class="Header-visuals">
            <div class="circle">
                <img src="men-picture.jpg" alt="Your Image Alt Text">
            </div>
        </div>
    </div>
</div>
</body>
</html>
